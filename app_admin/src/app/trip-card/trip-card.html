<div class="card" style="width: 16rem;">
  <div class="card-header">{{ trip()?.name }}</div>
  <img alt="trip thumbnail"
       class="card-img-top" src="assets/images/{{ trip()?.image }}">
  <div class="card-body">
    <h6 class="card-subtitle mb-2 text-muted">
      {{ trip()?.resort }}
    </h6>
    <p class="card-subtitle mt-3 mb-3 text-muted">
      {{ trip()?.length }} only {{ trip()?.perPerson | currency:'USD':true }} per person
    </p>
    <p [innerHTML]="trip()?.description" class="card-text">
    </p>
  </div>
</div>
